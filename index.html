<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angora project</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ------------------------------------ -->
    <!-- header -->
    <header class="vh-100">
        <div id="carouselExampleIndicators" class="position-relative carousel slide carousel-fade"
            data-bs-ride="carousel">

            <div class="carousel-inner">
                <div class="carousel-item  item-one active" data-bs-interval="2000">
                    <div class="text-white d-flex justify-content-center align-items-center h-100 text-center mx-auto">
                        <h1>We build great brands.</h1>
                    </div>
                </div>
                <div class="carousel-item item-two" data-bs-interval="2000">
                    <div
                        class="text-white d-flex justify-content-center align-items-center h-100 w-50 text-center mx-auto">
                        <h1>Focused on strategy.</h1>
                    </div>
                </div>
                <div class="carousel-item item-three" data-bs-interval="2000">
                    <div
                        class="text-white d-flex justify-content-center align-items-center h-100 w-50 text-center mx-auto">
                        <h1>Advanced in digital works.</h1>
                    </div>
                </div>
            </div>

            <div class="header-animation">
                <div class="animation-item mx-auto"></div>
            </div>

            <button class="carousel-control-prev rounded-end" type="button" data-bs-target="#carouselExampleIndicators"
                data-bs-slide="prev">
                <div class="layer"></div>
                <span class="position-absolute" aria-hidden="true"><i class="fa-solid fa-angle-left"></i></span>
                <span class="visually-hidden">Previous</span>

            </button>
            <button class="carousel-control-next rounded-end" type="button" data-bs-target="#carouselExampleIndicators"
                data-bs-slide="next">
                <div class="layer"></div>
                <span class="position-absolute" aria-hidden="true"><i class="fa-solid fa-angle-right"></i></span>
                <span class="visually-hidden">Next</span>

            </button>

        </div>
    </header>
    <!-- </header> -->
    <!-- ------------------------------------ -->



    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
